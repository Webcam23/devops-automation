apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-integration
  template:
    metadata:
      labels:
        app: devops-integration
    spec:
      containers:
        - name: devops-integration
          image: webcam23/devops-integration:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: devops-integration-service
spec:
  type: NodePort
  selector:
    app: devops-integration
  ports:
    - port: 8080
      targetPort: 8080